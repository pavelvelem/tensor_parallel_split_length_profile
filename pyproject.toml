[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pavelvelem-tensor_parallel_split_length_profile"
version = "0.1.0"
description = "按段落统计MoE 模型架构师·张量并行切分策略相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pavelvelem" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pavelvelem.github.io"
Repository = "https://github.com/pavelvelem/tensor_parallel_split_length_profile"
Issues = "https://github.com/pavelvelem/tensor_parallel_split_length_profile/issues"

[project.scripts]
tensor_parallel_split_length_profile = "tensor_parallel_split_length_profile:main"

[tool.setuptools]
py-modules = ["tensor_parallel_split_length_profile"]
